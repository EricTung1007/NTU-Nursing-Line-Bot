name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: pip install -r requirements.txt -r requirements-gui.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Stamp version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          Set-Content -Path nursebot/_version.py -Value "VERSION = `"$v`""
      - name: Build windowed app (no console)
        run: pyinstaller --clean --noconfirm packaging/NTULineBot.spec
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/NTULineBot-Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: pip install -r requirements.txt -r requirements-gui.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Stamp version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; v="${v#v}"; else v="0.0.0-dev"; fi
          echo "VERSION = \"$v\"" > nursebot/_version.py
      - name: Build app bundle and dmg
        run: |
          pyinstaller --clean --noconfirm packaging/NTULineBot.spec
          mkdir dmgroot
          cp -R dist/NTULineBot.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "NTU Nursing LINE Bot" -srcfolder dmgroot -ov -format UDZO dist/NTULineBot-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: dist/NTULineBot-mac.dmg

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --generate-notes --title "${{ github.ref_name }}"
